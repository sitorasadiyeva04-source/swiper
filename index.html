<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exquisite Watches</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Радиокнопки управления -->
    <input type="radio" name="slider" id="r1" checked>
    <input type="radio" name="slider" id="r2">
    <input type="radio" name="slider" id="r3">
    <input type="radio" name="slider" id="r4">

    <div class="main-container">

        <!-- Шапка сайта -->
        <div class="king">
            <img src="Logo.png" alt="Logo">
            <ul>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Brands</a></li>
                <li><a href="#">Contact us</a></li>
                <button>Sign up</button>
            </ul>
        </div>

        <!-- Текстовый блок -->
        <div class="content">
            <h1>Exquisite Watches</h1>
            <h2>Choose Luxury, <span>Choose Us</span></h2>
            <p>Discover the Perfect Watch for Every Occasion and Elevate Your Style with Timeless Elegance and Precision Craftsmanship</p>
            <div class="price">$430.00</div>
            <div class="socials">
                <a href="#" class="social-icon">f</a>
                <a href="#" class="social-icon">t</a>
                <a href="#" class="social-icon">in</a>
            </div>
        </div>

        <!-- Часы для Слайда 1 -->
        <div class="watch-box watch-1">
            <label for="r4" class="btn-prev">&lt;</label>
            <img src="Frame 28.png" alt="Watch">
            <label for="r2" class="btn-next">&gt;</label>
        </div>

        <!-- Часы для Слайда 2 -->
        <div class="watch-box watch-2">
            <label for="r1" class="btn-prev">&lt;</label>
            <img src="Watches.png" alt="Watch">
            <label for="r3" class="btn-next">&gt;</label>
        </div>

        <!-- Часы для Слайда 3 -->
        <div class="watch-box watch-3">
            <label for="r2" class="btn-prev">&lt;</label>
            <img src="Frame 28 (1).png" alt="Watch">
            <label for="r4" class="btn-next">&gt;</label>
        </div>

        <!-- Часы для Слайда 4 -->
        <div class="watch-box watch-4">
            <label for="r3" class="btn-prev">&lt;</label>
            <img src="Watches (1).png" alt="Watch">
            <label for="r1" class="btn-next">&gt;</label>
        </div>

    </div>




    <script src="https://unpkg.com/swiper@10/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
